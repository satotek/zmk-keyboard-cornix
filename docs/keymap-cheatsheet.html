<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cornix Keymap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --paper: #e3e7ea;
      --plate: #cfd6db;
      --cap: #fbfcfc;
      --cap-edge: #a9b4bb;
      --ghost: #eef1f3;
      --ink: #1c2428;
      --muted: #5c6970;
      --faint: #9aa5ab;

      --base: #1c2428;
      --symbols: #b0731a;
      --function: #7a4c9f;
      --adjust: #b33636;
      --navi: #3a7a46;
      --numpad: #2c5fae;
      --windows: #17807f;

      --font: "Atkinson Hyperlegible", "Hiragino Sans", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #14181b;
        --plate: #1f262a;
        --cap: #2d353a;
        --cap-edge: #0e1215;
        --ghost: #242b30;
        --ink: #e5eaed;
        --muted: #9ba7ad;
        --faint: #5f6a70;
        --base: #e5eaed;
        --symbols: #e2a54a;
        --function: #b98ad9;
        --adjust: #ea7069;
        --navi: #78b982;
        --numpad: #77a1ea;
        --windows: #4fc4c1;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
      line-height: 1.5;
    }

    main {
      width: min(1480px, 100% - 32px);
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    /* ---------- header ---------- */

    header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 12px 48px;
      align-items: end;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 4vw, 52px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px 22px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
      color: var(--muted);
    }

    .legend li { display: flex; align-items: center; gap: 8px; }

    .legend .sample {
      position: relative;
      width: 46px;
      height: 46px;
      container-type: size;
      flex: none;
    }

    /* ---------- layers ---------- */

    .layers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .layer {
      --accent: var(--base);
      background: var(--plate);
      border-radius: 18px;
      padding: 18px 20px 20px;
    }

    .layer.wide { grid-column: 1 / -1; }
    .layer.wide .board { max-width: 1060px; margin: 0 auto; }

    .layer-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 14px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }

    .how { font-size: 14px; color: var(--muted); }

    .note {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
    }

    /* ---------- board ---------- */

    .board { container-type: inline-size; }

    .plate {
      position: relative;
      width: 100%;
      aspect-ratio: 1450 / 535;
    }

    /* Each key is a 100×100-unit cell from the physical layout; the cap sits inset in it. */
    .key {
      position: absolute;
      width: calc(100% * 100 / 1450);
      height: calc(100% * 100 / 535);
      padding: 0.22cqw;
    }

    .cap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 0.75cqw;
      background: var(--cap);
      box-shadow: 0 0.28cqw 0 var(--cap-edge);
      overflow: hidden;
    }

    .tap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 0.3cqw;
      text-align: center;
      font-size: 1.45cqw;
      font-weight: 700;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .tap.short { font-size: 2.1cqw; }

    .hold {
      padding: 0.25cqw 0.2cqw 0.3cqw;
      text-align: center;
      font-size: 1.08cqw;
      font-weight: 700;
      line-height: 1.1;
      color: var(--muted);
      background: color-mix(in srgb, var(--muted) 12%, transparent);
    }

    /* Tap key that opens another layer: tinted in that layer's color. */
    .key.layer-key .cap { background: color-mix(in srgb, var(--target) 14%, var(--cap)); }
    .key.layer-key .tap { color: var(--target); }
    .key.layer-key .hold { color: var(--cap); background: var(--target); }

    /* The key you are holding to stay in this layer. */
    .key.held .cap {
      background: var(--accent);
      box-shadow: 0 0.12cqw 0 var(--cap-edge);
      transform: translateY(0.16cqw);
    }
    .key.held .tap, .key.held .hold { color: var(--cap); background: transparent; }

    /* Falls through to the layer below: show that key faintly. */
    .key.ghost .cap { background: var(--ghost); box-shadow: none; }
    .key.ghost .tap { color: var(--faint); font-weight: 400; }
    .key.ghost .hold { display: none; }

    .key.none .cap { background: transparent; box-shadow: inset 0 0 0 0.12cqw color-mix(in srgb, var(--faint) 45%, transparent); }

    .key.danger .hold { color: var(--cap); background: var(--adjust); }

    footer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 8px 32px;
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    footer p { margin: 0; max-width: 62ch; }
    footer strong { color: var(--ink); }

    @media (max-width: 1100px) {
      .layers { grid-template-columns: 1fr; }
      header { grid-template-columns: 1fr; }
      .legend { justify-content: flex-start; }
    }

    @media (max-width: 600px) {
      main { width: calc(100% - 32px); padding-top: 24px; }
      .layer { padding: 14px 10px 14px; border-radius: 14px; }
    }

    @media print {
      :root {
        --paper: #fff; --plate: #eef1f3; --cap: #fff; --cap-edge: #b4bec4; --ghost: #f4f6f7;
        --ink: #1c2428; --muted: #5c6970; --faint: #a3adb3; --base: #1c2428;
        --symbols: #b0731a; --function: #7a4c9f; --adjust: #b33636; --navi: #3a7a46; --numpad: #2c5fae; --windows: #17807f;
      }
      @page { size: A3 landscape; margin: 10mm; }
      main { width: 100%; padding: 0; }
      .layers { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
      .layer { break-inside: avoid; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Cornix keymap</h1>
      <ul class="legend" id="legend"></ul>
    </header>
    <div class="layers" id="layers"></div>
    <footer>
      <p><strong>ホームロウモッド</strong> A / S / D と K / L / ; は、押したまま反対の手のキーを打つと Ctrl・Alt・GUI になります。Esc の Ctrl は同じ手のキーとも組み合わせられます。</p>
      <p><strong>親指キー</strong> 先に離せば文字、押したまま次のキーを打てばレイヤー。文字を打った直後の親指は必ず文字になります。</p>
      <p><strong>ノブ</strong> 左が音量、右が PgUp / PgDn。Shift + Backspace は Delete です。</p>
    </footer>
  </main>

  <script>
    // Position 0–49 coordinates in 1/100 key units, from boards/jzf/cornix/cornix-layouts.dtsi.
    // The left half comes from that file; the right half is its mirror image.
    const W = 1450;
    const LEFT = {
      0: [0, 50], 1: [100, 50], 2: [200, 25], 3: [300, 0], 4: [400, 25], 5: [500, 50],
      12: [0, 150], 13: [100, 150], 14: [200, 125], 15: [300, 100], 16: [400, 125], 17: [500, 150],
      24: [0, 255], 25: [100, 255], 26: [200, 225], 27: [300, 200], 28: [400, 225], 29: [500, 255], 30: [600, 200],
      38: [0, 355], 39: [100, 355], 40: [200, 330], 41: [350, 363],
      42: [450, 370, 11.93, 500, 475], 43: [550, 365, 23, 500, 475],
    };
    const MIRROR = { 6: 5, 7: 4, 8: 3, 9: 2, 10: 1, 11: 0, 18: 17, 19: 16, 20: 15, 21: 14, 22: 13, 23: 12,
      31: 30, 32: 29, 33: 28, 34: 27, 35: 26, 36: 25, 37: 24, 44: 43, 45: 42, 46: 41, 47: 40, 48: 39, 49: 38 };
    const POS = { ...LEFT };
    for (const [r, l] of Object.entries(MIRROR)) {
      const [x, y, rot = 0, rx = 0, ry = 0] = LEFT[l];
      POS[r] = rot ? [W - x - 100, y, -rot, W - rx, ry] : [W - x - 100, y];
    }

    // Label syntax: "tap|hold". A hold of "@Layer" opens that layer; "2×" marks a double-tap key.
    // N = &none, T = &trans. Rows follow config/cornix.keymap (12 / 12 / 14 / 12 keys).
    const N = null, T = undefined;
    const layers = [
      { name: "Base", color: "base", wide: true, how: "既定のレイヤー",
        keys: [
          "Tab","Q","W","E","R","T", "Y","U","I","O","P","-",
          "Esc|Ctrl","A|Ctrl","S|Alt","D|GUI","F","G", "H","J","K|GUI","L|Alt",";|Ctrl","'",
          "Shift|1 shot","Z","X","C","V","B","Caps Word", "Repeat","N","M",",",".","/","\\|Shift",
          "Ctrl","GUI","Alt","Tab|@NumPad","英数|@Symbols","Space|@Navi", "Enter","かな|@Function","Bspc|⇧ Del","Ctrl","Alt","GUI",
        ] },
      { name: "Symbols", color: "symbols", held: [42], how: "英数を長押し",
        keys: [
          "`","~","!","@","#","$", "[","]","{","}","(",")",
          "%","^","&",";","'","\"", "=","-","+","*","/","\\",
          N,N,N,N,N,N,T, T,"<",">","_","|","?",":",
          T,T,T,T,T,T, T,T,T,T,T,T,
        ] },
      { name: "Function", color: "function", held: [45], how: "かなを長押し",
        keys: [
          "F1","F2","F3","F4","F5","F6", N,N,N,N,N,N,
          "F7","F8","F9","F10","F11","F12", "Home","End","PgUp","PgDn","Ins","PrtSc",
          T,N,N,N,N,N,T, T,N,N,N,N,N,T,
          T,T,T,T,T,T, T,T,T,T,T,T,
        ] },
      { name: "Navi", color: "navi", held: [43], how: "Space を長押し",
        keys: [
          N,"Click","Middle Click","Right Click","Scroll ↑","Scroll ↓", "Ins","Home","PgDn","PgUp","End","Del",
          N,"Mouse ←","Mouse ↓","Mouse ↑","Mouse →",N, "←","↓","↑","→","Caps Lock","Bspc",
          T,N,"Scroll ←","Scroll →",N,N,T, T,N,N,N,N,N,T,
          T,T,T,T,T,T, T,T,T,T,T,T,
        ] },
      { name: "NumPad", color: "numpad", held: [41], how: "Tab を長押し（テンキーのコード）",
        keys: [
          N,N,N,N,N,N, "7","8","9","-","*",N,
          N,N,N,N,N,N, "4","5","6","+","/",N,
          T,N,N,N,N,N,T, T,"1","2","3",N,N,T,
          T,T,T,N,N,T, "0",".","Enter",T,T,T,
        ] },
      { name: "Adjust", color: "adjust", held: [42, 45], how: "英数とかなを同時に長押し",
        keys: [
          "BT Clear|2×","BT 0","BT 1","BT 2","BT 3","BT 4", "USB / BLE","USB","BLE","Studio Unlock","Battery","Conn.",
          "Clear All|2×","Disc 0","Disc 1","Disc 2","Disc 3","Disc 4", "Base","Win IME","Caps Lock","Ext Power","Num Lock",N,
          "Pause","Scroll Lock","Menu","Reset|2×","Soft Off|2×","Boot L|2×",T, T,"Boot R|2×",N,N,N,N,N,
          N,N,N,T,T,T, T,T,T,N,N,N,
        ] },
      { name: "Windows", color: "windows", how: "Adjust の Win IME でオン / オフ。英数・かなのタップが無変換・変換になる",
        keys: [
          T,T,T,T,T,T, T,T,T,T,T,T,
          T,T,T,T,T,T, T,T,T,T,T,T,
          T,T,T,T,T,T,T, T,T,T,T,T,T,T,
          T,T,T,T,"無変換|@Symbols",T, T,"変換|@Function",T,T,T,T,
        ] },
    ];

    const base = layers[0].keys;
    const isShort = s => [...s].length <= 2;

    function capHTML(tap, hold) {
      const t = `<span class="tap${isShort(tap) ? " short" : ""}">${tap}</span>`;
      return `<div class="cap">${t}${hold ? `<span class="hold">${hold}</span>` : ""}</div>`;
    }

    function makeKey(label, pos, layer) {
      const el = document.createElement("div");
      el.className = "key";
      const held = layer.held?.includes(pos);
      let tap = "", hold = "";

      if (label === N) {
        el.classList.add("none");
      } else if (label === T) {
        // Show the base key it falls through to (Windows sits on Base, so that is exact for it too).
        [tap, hold] = base[pos].split("|");
        el.classList.add(held ? "held" : "ghost");
        if (held) hold = "hold";
      } else {
        [tap, hold = ""] = label.split("|");
        if (hold.startsWith("@")) {
          el.classList.add("layer-key");
          el.style.setProperty("--target", `var(--${hold.slice(1).toLowerCase()})`);
          hold = hold.slice(1);
        } else if (hold === "2×") {
          el.classList.add("danger");
          hold = "2× tap";
        }
      }
      el.innerHTML = capHTML(tap, hold);
      return el;
    }

    function placeKey(el, [x, y, rot, rx, ry]) {
      el.style.left = `${(x / W) * 100}%`;
      el.style.top = `${(y / 535) * 100}%`;
      if (rot) {
        el.style.transformOrigin = `${rx - x}% ${ry - y}%`;
        el.style.transform = `rotate(${rot}deg)`;
      }
    }

    const root = document.getElementById("layers");
    for (const layer of layers) {
      const section = document.createElement("section");
      section.className = `layer${layer.wide ? " wide" : ""}`;
      section.style.setProperty("--accent", `var(--${layer.color})`);
      section.innerHTML = `<div class="layer-head"><h2>${layer.name}</h2><span class="how">${layer.how}</span></div>`;
      const board = document.createElement("div");
      board.className = "board";
      const plate = document.createElement("div");
      plate.className = "plate";
      layer.keys.forEach((label, pos) => {
        const el = makeKey(label, pos, layer);
        placeKey(el, POS[pos]);
        plate.appendChild(el);
      });
      board.appendChild(plate);
      section.appendChild(board);
      root.appendChild(section);
    }

    // Legend samples reuse the real key renderer at a fixed size.
    const samples = [
      ["A|Ctrl", "タップで文字、長押しで修飾キー", {}],
      ["英数|@Symbols", "長押しで開くレイヤーの色", {}],
      [T, "押さえているキー", { held: [42] }, 42],
      [T, "下のレイヤーと同じ", {}, 13],
      ["Reset|2×", "2回タップで実行", {}],
    ];
    const legend = document.getElementById("legend");
    for (const [label, text, layer, pos = 0] of samples) {
      const li = document.createElement("li");
      const box = document.createElement("div");
      box.className = "sample";
      box.style.setProperty("--accent", "var(--symbols)");
      const key = makeKey(label, pos, layer);
      key.style.cssText = "position:absolute;inset:0;width:100%;height:100%;padding:0";
      key.querySelectorAll(".tap").forEach(t => t.style.fontSize = "13px");
      key.querySelectorAll(".hold").forEach(h => h.style.fontSize = "9px");
      key.querySelector(".cap").style.borderRadius = "7px";
      box.appendChild(key);
      li.append(box, text);
      legend.appendChild(li);
    }
  </script>
</body>
</html>
